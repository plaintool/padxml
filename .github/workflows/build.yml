name: Build
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CERT_PFX: ${{ secrets.CERT_PFX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install lazarus -y
          choco install wixtoolset -y

      - name: Build 64-bit binary
        shell: cmd
        run: build.cmd

      - name: Build 32-bit binary
        shell: cmd
        run: build32.cmd

      - name: Build installers (x64)
        shell: cmd
        env:
          BUILD_PORTABLE: 0
        run: installer\build.cmd x64 %VERSION%

      - name: Build installers (x86 + portable)
        shell: cmd
        env:
          BUILD_PORTABLE: 1
        run: installer\build.cmd x86 %VERSION%

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            installer/*.msi
            installer/*.zip

  release:
    needs: build
    uses: ./.github/workflows/create-release.yml
    with:
      tag_name: ${{ github.ref_name }}
      artifact_name: build-artifacts
